name: Silo image

# Fork-only build: publishes the Silo preview image to this fork's GHCR
# namespace. Not part of the upstream CI/release policy.
on:
  push:
    branches: [silo-image]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: silo-image
  cancel-in-progress: true

jobs:
  build:
    if: github.repository_owner != 'sparkmoxie'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Image name
        id: name
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/${owner}/tautweekly" >>"$GITHUB_OUTPUT"
          echo "version=silo-${GITHUB_SHA::7}" >>"$GITHUB_OUTPUT"
      - name: Build amd64 for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          file: platforms/nas-docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: tautweekly:smoke
          build-args: BUILD_VERSION=${{ steps.name.outputs.version }}
          cache-from: type=gha,scope=silo
          cache-to: type=gha,mode=max,scope=silo
      - name: Smoke test PowerShell, Silo module and WebP decoding
        run: |
          docker run --rm --entrypoint sh tautweekly:smoke -c '
            set -e
            pwsh -NoLogo -NoProfile -Command "\$PSVersionTable.PSVersion.ToString()"
            test -f /opt/tautweekly/Silo-Provider.ps1
            convert -list format | grep -E "^ *WEBP" | grep -q "r"
          '
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push amd64 + arm64
        uses: docker/build-push-action@v7
        with:
          context: .
          file: platforms/nas-docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:silo
            ${{ steps.name.outputs.image }}:${{ steps.name.outputs.version }}
          build-args: BUILD_VERSION=${{ steps.name.outputs.version }}
          cache-from: type=gha,scope=silo
          cache-to: type=gha,mode=max,scope=silo
